# A small, namespace-local MLflow Tracking Server (image built by
# manifests/buildconfig-mlflow.yaml from THIS repository). Backend store is SQLite on a
# small PVC; artifacts go to the namespace-local MinIO bucket "${MLFLOW_BUCKET}"
# (manifests/storage.yaml). Never deployed unless you explicitly run `make mlflow`.
#
# Rendered with envsubst by scripts/mlflow.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-data
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: rhoai-pytorch-trainer-demo
    app.kubernetes.io/managed-by: rhoai-pytorch-trainer-demo
    app.kubernetes.io/component: mlflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: rhoai-pytorch-trainer-demo
    app.kubernetes.io/managed-by: rhoai-pytorch-trainer-demo
    app.kubernetes.io/component: mlflow
    app.kubernetes.io/name: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/part-of: rhoai-pytorch-trainer-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/part-of: rhoai-pytorch-trainer-demo
    spec:
      containers:
        - name: mlflow
          image: ${MLFLOW_IMAGE}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MLFLOW_PORT
              value: "8080"
            - name: MLFLOW_BACKEND_STORE_URI
              value: "sqlite:////data/mlflow.db"
            - name: MLFLOW_ARTIFACT_ROOT
              value: "s3://${MLFLOW_BUCKET}/artifacts"
            - name: MLFLOW_S3_ENDPOINT_URL
              value: "http://minio.${NAMESPACE}.svc.cluster.local:9000"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: rhoai-pytorch-trainer-demo
    app.kubernetes.io/managed-by: rhoai-pytorch-trainer-demo
    app.kubernetes.io/component: mlflow
    app.kubernetes.io/name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: rhoai-pytorch-trainer-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mlflow
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: rhoai-pytorch-trainer-demo
    app.kubernetes.io/managed-by: rhoai-pytorch-trainer-demo
    app.kubernetes.io/component: mlflow
    app.kubernetes.io/name: mlflow
spec:
  to:
    kind: Service
    name: mlflow
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
